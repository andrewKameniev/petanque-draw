name: Reusable quality gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static-unit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run check:agent-contract
      - run: npm run check:ui-standards
      - run: npm run format:check
      - run: npm run lint:eslint
      - run: npm run stylelint
      - run: npm run test:tooling
      - run: npm run test:run
      - run: npm run test:ui-primitives
      - run: npm run build

  accessibility-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui-a11y
      - run: npm run test:ui-visual
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task11-accessibility-visual-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  emulator-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .firebase-emulators-cache
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:ui:emulator
      - name: Upload emulator E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task11-emulator-e2e-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
