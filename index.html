<!DOCTYPE html>
<html lang="en" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="title" content="Petanque Draw"/>
    <meta name="description" content="Program for drawing petanque tournaments: swiss & round & knockout systems"/>
    <meta property="og:site_name" content="Petanque Draw" />
    <meta property="og:title" content="Program for drawing petanque tournaments: swiss & round & knockout systems" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/petanque-draw/dist/img/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="theme-color" content="#471aa0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=optional" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=optional" rel="stylesheet">
    <link rel="icon" href="/petanque-draw/dist/favicon.ico">
    <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
    <title>Petanque Draw</title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but this app doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app">
      <div class="gooey">
        <span class="dot"></span>
        <div class="dots"><span></span><span></span><span></span></div>
      </div>
      <style>
        .gooey{position:fixed;top:50%;left:50%;width:142px;height:40px;margin:-20px 0 0 -71px}
        .gooey .dot{position:absolute;width:16px;height:16px;top:12px;left:15px;background:#471aa0;border-radius:50%;animation:dot 2.8s infinite}
        .gooey .dots{transform:translateX(0);margin-top:12px;margin-left:31px;animation:dots 2.8s infinite}
        .gooey .dots span{display:block;float:left;width:16px;height:16px;margin-left:16px;background:#471aa0;border-radius:50%}
        @keyframes dot{50%{transform:translateX(96px)}}
        @keyframes dots{50%{transform:translateX(-31px)}}
      </style>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
